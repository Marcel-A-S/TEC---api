
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Alunos</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>Gestão de Alunos</h1>
        <p>Sistema de cadastro de alunos</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar aluno</h2>

            <form id="formAluno">
                <label for="nome">Nome do aluno</label>
                <input type="text" id="nome"
                       name="nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email"
                       name="email" required>

                <button type="submit">
                    Cadastrar aluno
                </button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="card">
            <h2>Alunos cadastrados</h2>

            <button type="button" id="btnAtualizar">
                Atualizar lista
            </button>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaAlunos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
